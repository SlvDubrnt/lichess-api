apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "lichess-api.fullname" . }}-test-connection"
  labels:
    app.kubernetes.io/name: {{ include "lichess-api.name" . }}-test-connection
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "lichess-api.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
