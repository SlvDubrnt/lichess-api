apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lichess-api.fullname" . }}-mongodb-primary
  labels:
    app.kubernetes.io/name: {{ include "lichess-api.name" . }}-mongodb
    app.kubernetes.io/component: primary
spec:
  replicas: {{ .Values.mongodb.primary.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lichess-api.name" . }}-mongodb
      app.kubernetes.io/component: primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lichess-api.name" . }}-mongodb
        app.kubernetes.io/component: primary
    spec:
      containers:
      - name: mongodb
        image: {{ .Values.mongodb.image }}
        command: ["mongod", "--bind_ip_all", "--replSet", "{{ .Values.mongodb.replicaSetName }}"]
        ports:
        - containerPort: 27017
        resources:
          {{- toYaml .Values.mongodb.primary.resources | nindent 10 }}
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        livenessProbe:
          exec:
            command: ["/bin/sh", "-c", "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["/bin/sh", "-c", "mongosh --quiet --eval 'rs.status().myState == 1'"]
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: {{ include "lichess-api.fullname" . }}-mongodb-data
