apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lichess-api.fullname" . }}-caddy
  labels:
    app.kubernetes.io/name: {{ include "lichess-api.name" . }}-caddy
spec:
  replicas: {{ .Values.caddy.replicaCount | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lichess-api.name" . }}-caddy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lichess-api.name" . }}-caddy
    spec:
      containers:
      - name: caddy
        image: {{ .Values.caddy.image }}
        env:
          {{- range $key, $value := .Values.caddy.environment }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
        ports:
        - containerPort: 80
        resources:
          {{- toYaml .Values.caddy.resources | nindent 10 }}

