apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lichess-api.fullname" . }}-mongodb-secondary
  labels:
    app.kubernetes.io/name: {{ include "lichess-api.name" . }}-mongodb
    app.kubernetes.io/component: secondary
spec:
  replicas: {{ .Values.mongodb.secondary.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lichess-api.name" . }}-mongodb
      app.kubernetes.io/component: secondary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "lichess-api.name" . }}-mongodb
        app.kubernetes.io/component: secondary
    spec:
      containers:
      - name: mongodb
        image: {{ .Values.mongodb.image }}
        command: ["mongod", "--bind_ip_all", "--replSet", "{{ .Values.mongodb.replicaSetName }}"]
        ports:
        - containerPort: 27017
        resources:
          {{- toYaml .Values.mongodb.secondary.resources | nindent 10 }}

