    app.kubernetes.io/name: {{ include "lichess-api.name" . }}-redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app.kubernetes.io/name: {{ include "lichess-api.name" . }}-redis

